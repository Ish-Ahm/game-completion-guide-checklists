  @media (prefers-color-scheme: dark) {

    --ink: #eef3fa; --ink-soft: #b3c0d0; --red: #ff6b5e; --gold: #f2bd4b;
    --pine: #6fcf9d; --done-bg: #1f3d35; --sold: #c3a5f0; --shadow: #07101c; --fb: #8fb0f0; color-scheme: dark;

  body {
    margin: 0; background: var(--sky); color: var(--ink);
    font-family: "Nunito", "Segoe UI", system-ui, sans-serif; font-size: 16px; line-height: 1.5;
  }
  h1, h2, h3 { font-family: "Chewy", "Comic Sans MS", "Trebuchet MS", cursive; font-weight: 400; margin: 0; text-wrap: balance; }

  header { padding: 2.5rem 1rem 0; text-align: center; overflow: hidden; }
  header h1 { font-size: clamp(2.2rem, 7vw, 3.6rem); line-height: 1.05; color: var(--snow); text-shadow: 3px 3px 0 var(--shadow); }
  header p { max-width: 38rem; margin: .75rem auto 0; font-weight: 600; }

  .mountains .far { fill: var(--sky-deep); } .mountains .near { fill: var(--pine); } .mountains .cap { fill: var(--snow); }

  main { max-width: 54rem; margin: 0 auto; padding: 0 1rem 4rem; }

  .progress-wrap {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--paper); border: 3px solid var(--ink); border-radius: 14px;

  }
  .tabs { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: .7rem; }
  .tab {
    font-family: "Chewy", "Comic Sans MS", cursive; font-size: 1.15rem; cursor: pointer;
    padding: .25rem .9rem; border-radius: 10px 14px 8px 12px; border: 3px solid var(--ink);
    background: var(--sky); color: var(--ink);
  }
  .tab[aria-selected="true"] { background: var(--red); color: var(--snow); border-color: var(--ink); }
  .progress-top { display: flex; align-items: baseline; justify-content: space-between; gap: .4rem 1rem; flex-wrap: wrap; }
  .progress-top h2 { font-size: 1.3rem; }
  .counts { display: flex; gap: .3rem 1rem; flex-wrap: wrap; font-weight: 800; font-variant-numeric: tabular-nums; }
  .counts small { font-weight: 600; color: var(--ink-soft); }
  .stick { margin-top: .6rem; height: 18px; border: 3px solid var(--ink); border-radius: 999px; background: var(--sky); overflow: hidden; }
  .stick-fill { height: 100%; width: 0%; background: repeating-linear-gradient(115deg, var(--wood-a) 0 10px, var(--wood-b) 10px 20px); transition: width .45s ease; }
  .controls { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .75rem; align-items: center; }
  .chip {
    font: inherit; font-weight: 800; font-size: .88rem; cursor: pointer;
    padding: .3rem .8rem; border-radius: 999px; border: 2px solid var(--ink);
    background: transparent; color: var(--ink);
  }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .search {
    font: inherit; font-size: .95rem; flex: 1 1 12rem; min-width: 0;
    padding: .35rem .8rem; border-radius: 999px; border: 2px solid var(--ink);

  }
  .save-row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin-top: .7rem; padding-top: .6rem; border-top: 2px dashed color-mix(in srgb, var(--ink) 25%, transparent); font-size: .9rem; }
  .save-status { font-weight: 700; color: var(--ink-soft); flex: 1 1 14rem; }
  .chip.reset { border-color: var(--red); color: var(--red); }
  .chip.reset.armed { background: var(--red); color: var(--paper); }
  .chip:focus-visible, .tab:focus-visible, .search:focus-visible, .check:focus-visible, .sold-btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  .tips { background: var(--paper); border: 3px solid var(--ink); border-radius: 8px 16px 10px 14px; box-shadow: 5px 5px 0 var(--shadow); padding: .9rem 1.1rem; margin-bottom: 1.75rem; }
  .tips h2 { font-size: 1.45rem; color: var(--red); }
  .tips ul { margin: .4rem 0 0; padding-left: 1.2rem; }
  .tips li + li { margin-top: .35rem; }

  section.sheet {
    background: var(--paper); border: 3px solid var(--ink); border-radius: 6px 18px 8px 14px;

  .sheet-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }

  .intro { margin: .35rem 0 .75rem; color: var(--ink-soft); max-width: 42rem; }

  ul.groups { list-style: none; margin: 0; padding: 0; }
  li.group { border-top: 2px dashed color-mix(in srgb, var(--ink) 25%, transparent); padding: .7rem 0; }
  li.group.hidden { display: none; }
  .row { display: grid; grid-template-columns: auto 1fr auto; gap: .75rem; align-items: start; border-radius: 10px; padding: .35rem .4rem; transition: background .2s; }
  li.group.complete > .row { background: var(--done-bg); }
  li.group.sold > .row { background: color-mix(in srgb, var(--sold) 14%, transparent); }

  .check-wrap { position: relative; width: 30px; height: 30px; margin-top: .1rem; }
  .check-wrap.small { width: 24px; height: 24px; }
  .check {
    appearance: none; -webkit-appearance: none; margin: 0; width: 100%; height: 100%; cursor: pointer;
    border: 3px solid var(--ink); border-radius: 6px 9px 5px 8px; background: var(--paper);
  }
  .tick { position: absolute; inset: 0; pointer-events: none; width: 100%; height: 100%; }
  .tick path { stroke: var(--pine); stroke-width: 4.5; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 40; stroke-dashoffset: 40; transition: stroke-dashoffset .3s ease; }
  .check:checked + .tick path.t { stroke-dashoffset: 0; }
  .tick path.dash { stroke: var(--gold); stroke-dasharray: none; opacity: 0; }
  .check:indeterminate + .tick path.dash { opacity: 1; }

  .title-line { display: flex; align-items: center; gap: .4rem .5rem; flex-wrap: wrap; }
  .title-line h3 { font-size: 1.28rem; line-height: 1.2; }
  .title-line h3 label { cursor: pointer; }
  li.group.complete > .row h3, li.group.sold > .row h3 { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--ink-soft); }
  .tag { display: inline-block; font-size: .72rem; font-weight: 800; padding: 0 .5rem; border-radius: 999px; border: 2px solid currentColor; letter-spacing: .04em; text-transform: uppercase; }
  .tag.miss { color: var(--red); } .tag.shop { color: var(--ink-soft); } .tag.set { color: var(--gold); }
  .tag.story { color: var(--pine); } .tag.summon { color: var(--fb); }
  .num { font-size: .8rem; font-weight: 800; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .desc { margin: .2rem 0 0; font-size: .95rem; }
  .note { margin: .3rem 0 0; font-size: .88rem; font-weight: 700; color: var(--ink-soft); border-left: 3px solid var(--gold); padding-left: .5rem; }
  .pcount { font-size: .88rem; font-weight: 800; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  ul.pieces { list-style: none; margin: .55rem 0 0; padding: 0; display: grid; gap: .35rem; }
  ul.pieces.compact { grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr)); }
  li.piece { display: grid; grid-template-columns: auto 1fr; gap: .6rem; align-items: start; padding: .4rem .5rem; border-radius: 8px; border-left: 3px solid color-mix(in srgb, var(--ink) 20%, transparent); }
  li.piece.got { background: var(--done-bg); border-left-color: var(--pine); }
  .piece-name { font-weight: 800; }
  .piece-name label { cursor: pointer; }
  li.piece.got .piece-name { text-decoration: line-through; color: var(--ink-soft); }
  .slot { font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); margin-right: .3rem; }
  li.piece .desc { font-size: .9rem; margin-top: .1rem; }

  .sold-btn {
    font: inherit; font-size: .8rem; font-weight: 800; cursor: pointer; white-space: nowrap;
    padding: .2rem .65rem; border-radius: 999px; border: 2px solid var(--sold); background: transparent; color: var(--sold);

  .sold-btn[aria-pressed="true"] { background: var(--sold); color: var(--paper); }

  .empty { text-align: center; color: var(--ink-soft); font-weight: 700; padding: .5rem 0 1rem; }

  footer { text-align: center; padding: 0 1rem 2rem; font-size: .9rem; }
  footer a { color: var(--ink); font-weight: 800; }

  @media (min-width: 700px) {
    section.sheet:nth-of-type(odd) { transform: rotate(-.25deg); }
    section.sheet:nth-of-type(even) { transform: rotate(.2deg); }
  }
  @media (max-width: 520px) {
    .progress-wrap { position: static; }
    section.sheet { padding: 1rem .8rem .4rem; }
    .row { grid-template-columns: auto 1fr; }
    .row .sold-btn { grid-column: 2; justify-self: start; }
  }
  @media (prefers-reduced-motion: reduce) { .stick-fill, .tick path, .row { transition: none; } }

const wPiece = (n, i, set) => ({ id: "w" + n, num: n, name: ITEMS[n][0], desc: ITEMS[n][2], miss: !!ITEMS[n][1], note: NOTES[n] || "", slot: set ? SLOTS[i] : "" });
function weaponGroups(layout) {
  return layout.map(e => {
    if (Array.isArray(e)) {
      const pieces = e.slice(1).map((n, i) => wPiece(n, i, true));
      return { key: "set-" + e[0].toLowerCase().replace(/[^a-z]+/g, "-"), name: e[0] + " Set", set: true, sellable: true, pieces,
        tags: ["set"].concat(pieces.some(p => p.miss) ? ["miss"] : [], e.slice(1).every(isShop) ? ["shop"] : []) };
    }
    const p = wPiece(e, 0, false);
    return { key: p.id, name: p.name, num: e, set: false, sellable: true, pieces: [p], desc: p.desc, note: p.note,
      tags: (p.miss ? ["miss"] : []).concat(isShop(e) ? ["shop"] : []) };
  });
}
function friendGroups() {

      continue;
    }
    const [name, miss, desc] = FRIENDS[n];
    const tags = [];
    if (miss) tags.push("miss");
    if (desc === "Main questline.") tags.push("story");
    if (/Summon/.test(name)) tags.push("summon");
    out.push({ key: "f" + n, name, num: n, set: false, pieces: [{ id: "f" + n, num: n, name, desc, miss: !!miss }], desc, tags });

}

function clean(s) {
  const out = { got: {}, sold: {} };
  if (!s || typeof s !== "object") return out;
  if (s.got && typeof s.got === "object") for (const k in s.got) if (s.got[k] === true && /^[wf]\d+$/.test(k)) out.got[k] = true;
  if (s.sold && typeof s.sold === "object") for (const k in s.sold) if (s.sold[k] === true) out.sold[k] = true;
  return out;
}

/* ---------- render ---------- */
const TICK = '<svg class="tick" viewBox="0 0 30 30" aria-hidden="true"><path class="t" d="M6 15 L12 22 L24 7"/><path class="dash" d="M8 15 L22 15"/></svg>';
const TAG_HTML = { miss: '<span class="tag miss">Missable</span>', shop: '<span class="tag shop">Shop</span>', set: '<span class="tag set">Set of 3</span>',
  set12: '<span class="tag set">12 critters</span>', story: '<span class="tag story">Story</span>', summon: '<span class="tag summon">Summon</span>' };

function renderGroup(g) {
  const numLabel = g.numLabel || (g.set ? "" : "#" + g.num);
  const pieces = g.set ? `<ul class="pieces${g.compact ? " compact" : ""}">${g.pieces.map(p => `
      <li class="piece" data-piece="${p.id}">
        <div class="check-wrap small"><input type="checkbox" class="check" id="p-${p.id}" data-piece="${p.id}" aria-label="Mark ${esc(p.name)} as done">${TICK}</div>
        <div>
          <div class="piece-name">${p.slot ? `<span class="slot">${p.slot}</span>` : ""}<label for="p-${p.id}">${esc(p.name)}</label>${g.compact ? "" : ` <span class="num">#${p.num}</span>`}${p.miss ? ' <span class="tag miss">Missable</span>' : ""}</div>
          ${p.desc ? `<p class="desc">${esc(p.desc)}</p>` : ""}
          ${p.note ? `<p class="note">${esc(p.note)}</p>` : ""}
        </div>
      </li>`).join("")}</ul>` : "";
  return `<li class="group" data-key="${g.key}">
    <div class="row">
      <div class="check-wrap"><input type="checkbox" class="check" id="g-${g.key}" data-group="${g.key}" aria-label="Mark ${esc(g.name)} as done">${TICK}</div>
      <div>
        <div class="title-line">
          <h3><label for="g-${g.key}">${esc(g.name)}</label></h3>
          ${numLabel ? `<span class="num">${numLabel}</span>` : ""}
          ${g.tags.map(t => TAG_HTML[t]).join("")}
          ${g.set ? `<span class="pcount" data-pcount="${g.key}"></span>` : ""}
        </div>
        ${g.desc ? `<p class="desc">${esc(g.desc)}</p>` : ""}
        ${!g.set && g.note ? `<p class="note">${esc(g.note)}</p>` : ""}
        ${pieces}
      </div>
      ${g.sellable ? `<button class="sold-btn" data-sold="${g.key}" aria-pressed="false" hidden>Mark sold</button>` : ""}
    </div>
  </li>`;
}

function render() {
  const T = TABS[tab];
  document.getElementById("app-root").innerHTML = `
  <header>
    <h1>The Stick of Truth<br>Collection Checklist</h1>
    <p>Every weapon, costume piece and friend request for Full Arsenal and More Popular Than John Lennon. Ticks save in this browser as you go.</p>
    <svg class="mountains" viewBox="0 0 1200 90" preserveAspectRatio="none" aria-hidden="true">
      <path class="far" d="M0 90 L140 30 L260 70 L420 10 L560 60 L700 20 L860 65 L1010 15 L1200 70 L1200 90 Z"/>
      <path class="cap" d="M420 10 L455 26 L440 30 L420 24 L398 31 L390 24 Z M1010 15 L1045 30 L1025 33 L1008 27 L990 34 L982 27 Z M700 20 L728 33 L712 36 L698 30 L684 35 L678 29 Z"/>
      <path class="near" d="M0 90 L90 60 L230 85 L380 50 L520 88 L680 55 L840 86 L990 52 L1120 84 L1200 62 L1200 90 Z"/>
    </svg>
  </header>
  <main>
    <div class="progress-wrap" role="region" aria-label="Progress">
      <div class="tabs" role="tablist">
        ${TAB_IDS.map(t => `<button class="tab" role="tab" data-tab="${t}" aria-selected="${t === tab}">${TABS[t].label}</button>`).join("")}
      </div>
      <div class="progress-top">
        <h2>${T.heading}</h2>
        <div class="counts" id="counts"></div>
      </div>
      <div class="stick" role="progressbar" aria-label="${T.heading} progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar"><div class="stick-fill" id="fill"></div></div>
      <div class="controls">
        ${T.filters.map(([f, l]) => `<button class="chip" data-filter="${f}" aria-pressed="${f === filter}">${l}</button>`).join("")}
        <input type="search" class="search" id="search" placeholder="${T.placeholder}" aria-label="Search" value="${esc(query)}">
      </div>
      <div class="save-row">
        <span class="save-status" id="save-status">Saved in this browser automatically.</span>
        <button class="chip" id="export">Back up progress</button>
        <button class="chip" id="import">Restore backup</button>
        <input type="file" id="import-file" accept=".json,application/json" hidden>
        <button class="chip reset" id="reset">Reset ${T.label}</button>
      </div>
    </div>

    <div class="tips">
      <h2>Before you start</h2>
      <ul>${T.tips.map(t => `<li>${t}</li>`).join("")}</ul>
    </div>

    ${T.sections.map(sec => `
    <section class="sheet" aria-labelledby="h-${sec.id}">
      <div class="sheet-head">
        <h2 id="h-${sec.id}">${sec.title}</h2>
        <span class="sub" data-sub="${sec.id}"></span>
      </div>
      <p class="intro">${sec.intro}</p>
      <ul class="groups">${sec.groups.map(renderGroup).join("")}</ul>
      <p class="empty" data-empty="${sec.id}" hidden></p>
    </section>`).join("")}
  </main>
  <footer>
    Lists and locations from the <a href="https://psnprofiles.com/guide/86-south-park-the-stick-of-truth-trophy-guide" target="_blank" rel="noopener">PSNProfiles trophy guide</a>.
    Notes marked with a yellow line come from other community guides.
  </footer>`;
  wire();
  update();
}

function wire() {
  const root = document.getElementById("app-root");
  const T = TABS[tab];
  root.querySelectorAll("input[data-piece]").forEach(cb => cb.addEventListener("change", () => {
    if (cb.checked) state.got[cb.dataset.piece] = true; else delete state.got[cb.dataset.piece];
    const g = T.groups.find(x => x.pieces.some(p => p.id === cb.dataset.piece));
    if (g && !done(g)) delete state.sold[g.key];
    changed();
  }));
  root.querySelectorAll("input[data-group]").forEach(cb => cb.addEventListener("change", () => {
    const g = T.groups.find(x => x.key === cb.dataset.group);
    const fill = !done(g);
    g.pieces.forEach(p => { if (fill) state.got[p.id] = true; else delete state.got[p.id]; });
    if (!fill) delete state.sold[g.key];
    changed();
  }));
  root.querySelectorAll(".sold-btn").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.sold;
    if (state.sold[k]) delete state.sold[k]; else state.sold[k] = true;
    changed();
  }));
  root.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.tab === tab) return;
    tab = b.dataset.tab; filter = "all"; query = "";
    try { localStorage.setItem(KEY + "-tab", tab); } catch (e) {}
    render();
  }));
  root.querySelectorAll(".chip[data-filter]").forEach(chip => chip.addEventListener("click", () => {
    filter = chip.dataset.filter;
    root.querySelectorAll(".chip[data-filter]").forEach(c => c.setAttribute("aria-pressed", String(c === chip)));
    update();
  }));
  document.getElementById("search").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); update(); });

  let armTimer = null;
  const reset = document.getElementById("reset");
  reset.addEventListener("click", () => {
    if (!reset.classList.contains("armed")) {
      reset.classList.add("armed"); reset.textContent = "Tap again to clear this tab";
      armTimer = setTimeout(() => { reset.classList.remove("armed"); reset.textContent = "Reset " + T.label; }, 3500);
      return;
    }
    clearTimeout(armTimer);
    T.groups.forEach(g => { g.pieces.forEach(p => delete state.got[p.id]); delete state.sold[g.key]; });
    changed();
    reset.classList.remove("armed"); reset.textContent = "Reset " + T.label;
  });

  document.getElementById("export").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "stick-of-truth-collection.json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    status("Backup saved as stick-of-truth-collection.json.");
  });
  const fileInput = document.getElementById("import-file");
  document.getElementById("import").addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => {
    const f = fileInput.files[0];
    if (!f) return;
    f.text().then(txt => {
      const data = JSON.parse(txt);
      if (!data || typeof data !== "object" || !data.got) throw new Error();
      state = clean(data); save(); render(); status("Backup restored.");
    }).catch(() => status("That file isn't a checklist backup. Choose a stick-of-truth-collection.json file."));
    fileInput.value = "";
  });
}

let statusTimer = null;
function status(msg) {
  const el = document.getElementById("save-status");
  el.textContent = msg;
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => { el.textContent = "Saved in this browser automatically."; }, 4000);
}

function matches(g) {
  const d = done(g), n = got(g);
  if (filter === "missing" && d) return false;
  if (filter === "partial" && !(g.set && n > 0 && !d)) return false;
  if (filter === "sell" && !(d && !state.sold[g.key])) return false;
  if (filter === "missable" && !g.pieces.some(p => p.miss) && !g.tags.includes("miss")) return false;
  if (filter === "story" && !g.tags.includes("story")) return false;
  if (filter === "side" && g.tags.includes("story")) return false;
  if (query) {
    const hay = (g.name + " " + (g.desc || "") + " " + g.pieces.map(p => p.name + " " + p.desc + " " + (p.note || "")).join(" ")).toLowerCase();
    if (!hay.includes(query)) return false;
  }
  return true;
}

function update() {
  const T = TABS[tab];
  let col = 0, pieces = 0, sold = 0;
  T.sections.forEach(sec => {
    let sDone = 0, visible = 0;
    sec.groups.forEach(g => {
      const n = got(g), d = n === g.pieces.length;
      pieces += n;
      if (d) { col++; sDone++; }
      const isSold = d && !!state.sold[g.key];
      if (isSold) sold++;
      const li = document.querySelector(`li.group[data-key="${g.key}"]`);
      li.classList.toggle("complete", d && !isSold);
      li.classList.toggle("sold", isSold);
      const gcb = document.getElementById("g-" + g.key);
      gcb.checked = d; gcb.indeterminate = n > 0 && !d;
      if (g.set) {
        li.querySelector(`[data-pcount="${g.key}"]`).textContent = `${n} / ${g.pieces.length}${g.compact ? "" : " pieces"}`;
        g.pieces.forEach(p => {
          document.getElementById("p-" + p.id).checked = !!state.got[p.id];
          li.querySelector(`li.piece[data-piece="${p.id}"]`).classList.toggle("got", !!state.got[p.id]);
        });
      }
      const sb = li.querySelector(".sold-btn");
      if (sb) {
        sb.hidden = !d;
        sb.setAttribute("aria-pressed", String(isSold));
        sb.textContent = isSold ? "Sold ✓" : "Mark sold";
      }
      const show = matches(g);
      li.classList.toggle("hidden", !show);
      if (show) visible++;
    });
    document.querySelector(`[data-sub="${sec.id}"]`).textContent = tab === "friends" ? "" : `${sDone} / ${sec.groups.length}`;
    const empty = document.querySelector(`[data-empty="${sec.id}"]`);
    empty.hidden = visible > 0;
    empty.textContent = query ? "No matches in this section." : filter === "missing" ? "Everything here is done." : "Nothing here for this filter.";
  });
  let pct, html;
  if (tab === "arsenal") {
    pct = Math.round(col / T.groups.length * 100);
    html = `<span>${col} / ${T.groups.length} <small>collectibles</small></span><span>${pieces} / ${T.pieceCount} <small>pieces</small></span><span>${sold} <small>sold</small></span>`;
  } else {
    pct = Math.round(pieces / T.pieceCount * 100);
    html = `<span>${pieces} / ${T.pieceCount} <small>friends</small></span>`;
  }
  document.getElementById("counts").innerHTML = html;
  document.getElementById("fill").style.width = pct + "%";
  document.getElementById("bar").setAttribute("aria-valuenow", pct);
}
function changed() { save(); update(); }

render();
})();
</script>
<!-- hub:body -->
<script>
(function () {
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("../sw.js");
  var page = location.pathname.split("/").pop() || "index.html";
  var top = window.top === window;

  // Slim "All games" link, lifted above any fixed bar along the bottom edge
  document.body.appendChild(Object.assign(document.createElement("div"), { className: "hub-spacer" }));
  if (top) {
    var a = document.createElement("a");
    a.className = "hub-back"; a.href = "../"; a.textContent = "← All games";
    document.body.appendChild(a);
    var lift = function () {
      var h = 0, vh = innerHeight, all = document.body.getElementsByTagName("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i]; if (el === a) continue;
        var cs = getComputedStyle(el);
        if (cs.position !== "fixed" || cs.display === "none" || cs.visibility === "hidden") continue;
        var r = el.getBoundingClientRect();
        if (r.width && r.height && r.bottom >= vh - 4 && r.left < 170 && r.height < vh / 2) h = Math.max(h, vh - r.top);
      }
      a.style.setProperty("--hub-lift", h ? (h + 2) + "px" : "0px");
    };
    var lt; var queue = function () { clearTimeout(lt); lt = setTimeout(lift, 150); };
    addEventListener("resize", queue); addEventListener("load", queue); lift();
  }

  // Mirror the page's own "x / N" readout into a shared cache for the home page
  var RE = /(\d[\d,]*)\s*(?:\/|of)\s*(\d[\d,]*)\s*(?:unlocked|done|collectibles)/;
  var node = null, timer;
  function find() {
    var w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
    for (var n; (n = w.nextNode());) {
      if (RE.test(n.nodeValue)) return n.parentElement;
      var p = n.parentElement;
      if (p && p.childElementCount && RE.test(p.textContent)) return p;
    }
    return null;
  }
  function record() {
    if (!node || !node.isConnected) node = find();
    if (!node) return;
    var m = RE.exec(node.textContent); if (!m) return;
    try {
      var all = JSON.parse(localStorage.getItem("hub-progress-v1") || "{}") || {};
      all[page] = { done: +m[1].replace(/,/g, ""), total: +m[2].replace(/,/g, ""), t: Date.now() };
      localStorage.setItem("hub-progress-v1", JSON.stringify(all));
    } catch (e) {}
  }
  function soon() { clearTimeout(timer); timer = setTimeout(record, 250); }
  function start() {
    record();
    var host = node; for (var i = 0; host && i < 3 && host.parentElement && host.parentElement !== document.body; i++) host = host.parentElement;
    new MutationObserver(soon).observe(host || document.body, { subtree: true, childList: true, characterData: true });
  }
  if (document.readyState === "complete") start(); else addEventListener("load", start);
  addEventListener("pagehide", record);
})();
</script>
